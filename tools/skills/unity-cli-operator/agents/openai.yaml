interface:
  display_name: "Unity CLI Operator"
  short_description: "Primary entry point for controlling Unity from outside the Editor. Check this before a headless Unity -batchmode launch or a Unity MCP server (this repo has no MCP)."
  default_prompt: |
    If Unity control is needed, use $unity-cli-operator first.
    Invoke Bash `ucli ...` (or `unity-cli ...`).
    This repo has no MCP and no `batch` subcommand — multiple tasks are N calls (parallel when independent).
    Required: pass `--project <name|path>`, confirm projectName with `ucli status` before writes, and use `--output compact` when an LLM consumes the output.
