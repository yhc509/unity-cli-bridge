name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Run every OS to completion so a platform-specific failure is reported
      # alongside the passing ones, not hidden behind the first cancellation.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Filesystem-independent checks; running each once is enough.
      - name: Verify UPM .meta files
        if: matrix.os == 'ubuntu-latest'
        run: scripts/check-unity-meta.sh

      - name: Verify plugin skill sync
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: scripts/sync-plugin-skill.sh --check

      # No Unity Editor. The release archive is built on Ubuntu too.
      - name: Verify .unitypackage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: scripts/check-unitypackage.sh

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore locked dependencies
        run: dotnet restore UnityCliBridge.sln --locked-mode

      - name: Build solution
        run: dotnet build UnityCliBridge.sln -c Debug --no-restore

      - name: Run tests
        run: dotnet test UnityCliBridge.sln --no-restore
